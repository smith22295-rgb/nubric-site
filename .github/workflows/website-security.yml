name: Website security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-24.04
    steps:
      - name: Read public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check browser policies, form safety and accidental private files
        run: python3 _ops/security/verify.py
